name: Triage
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to triage (for manual testing)'
        required: true
        type: number

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve issue
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            let issue;
            if (context.eventName === 'workflow_dispatch') {
              const { data } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt('${{ inputs.issue_number }}')
              });
              issue = data;
            } else {
              issue = context.payload.issue;
            }
            core.setOutput('number', issue.number);
            core.setOutput('title', issue.title);
            core.setOutput('body', issue.body || '(no body)');
            core.setOutput('author', issue.user.login);

      - name: Rate limit check
        id: rate-limit
        uses: actions/github-script@v7
        with:
          script: |
            const since = new Date(Date.now() - 60 * 60 * 1000).toISOString();
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: '${{ steps.resolve.outputs.author }}',
              since,
              state: 'all',
              per_page: 10
            });
            const recentCount = issues.data.filter(i =>
              new Date(i.created_at) >= new Date(since)
            ).length;
            if (recentCount > 5) {
              core.setOutput('skip', 'true');
              core.info(`Rate limited: ${{ steps.resolve.outputs.author }} opened ${recentCount} issues in the last hour`);
            } else {
              core.setOutput('skip', 'false');
            }

      - name: Gather context
        if: steps.rate-limit.outputs.skip != 'true'
        id: context
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Issue details
            const issueContext = `# Issue #${{ steps.resolve.outputs.number }}: ${{ steps.resolve.outputs.title }}\n\n${{ steps.resolve.outputs.body }}`;

            // Open issues for duplicate detection
            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const issueList = openIssues.data
              .filter(i => i.number !== parseInt('${{ steps.resolve.outputs.number }}') && !i.pull_request)
              .map(i => {
                const labels = i.labels.map(l => l.name).join(', ');
                return `- #${i.number}: ${i.title} [${labels}]`;
              })
              .join('\n');

            // Write context file for Copilot CLI
            const prompt = [
              issueContext,
              '',
              '## Open Issues (for duplicate detection)',
              issueList || '(none)',
              '',
              '## Project Files',
              'Read @spec.md and @design.md for project context.',
              '',
              'Classify this issue following the instructions in @.github/prompts/triage-prompt.md',
              'Output ONLY the JSON object.'
            ].join('\n');

            fs.writeFileSync('triage-input.md', prompt);
            core.info(`Wrote triage-input.md (${prompt.length} chars)`);

      - uses: actions/setup-node@v4
        if: steps.rate-limit.outputs.skip != 'true'
        with:
          node-version: '22'

      - name: Install Copilot CLI
        if: steps.rate-limit.outputs.skip != 'true'
        run: npm install -g @github/copilot

      - name: Run triage
        if: steps.rate-limit.outputs.skip != 'true'
        id: triage
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          PROMPT=$(cat triage-input.md)
          copilot --allow-all --prompt "$PROMPT" 2>copilot-stderr.log | tee copilot-output.txt
          # Extract JSON from output (find first { to last })
          python3 -c "
          import json, re, sys
          text = open('copilot-output.txt').read()
          # Find JSON object in output
          match = re.search(r'\{[^{}]*(?:\{[^{}]*\}[^{}]*)*\}', text, re.DOTALL)
          if not match:
              print('::error::No JSON found in Copilot output')
              sys.exit(1)
          result = json.loads(match.group())
          # Validate required fields
          for field in ['classification', 'labels', 'pm', 'dev']:
              if field not in result:
                  print(f'::error::Missing field: {field}')
                  sys.exit(1)
          for role in ['pm', 'dev']:
              if 'verdict' not in result[role] or 'reasoning' not in result[role]:
                  print(f'::error::Missing verdict/reasoning in {role}')
                  sys.exit(1)
          # Write outputs
          with open('triage-result.json', 'w') as f:
              json.dump(result, f)
          print(json.dumps(result, indent=2))
          "

      - name: Apply labels
        if: steps.rate-limit.outputs.skip != 'true' && steps.triage.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('triage-result.json', 'utf8'));
            const issue_number = parseInt('${{ steps.resolve.outputs.number }}');

            // Apply labels
            if (result.labels && result.labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                labels: result.labels
              });
              core.info(`Applied labels: ${result.labels.join(', ')}`);
            }

            // Verdict emoji
            const emoji = v => v === 'approve' ? '✅' : v === 'reject' ? '❌' : '💬';

            // Build comment with two perspectives
            let comment = `### 🤖 Triage Bot\n\n`;
            comment += `**Classification:** ${result.classification}`;
            if (result.affected_area) {
              comment += ` · **Area:** ${result.affected_area}`;
            }
            comment += `\n\n`;

            if (result.duplicate_of) {
              comment += `> Likely duplicate of #${result.duplicate_of}\n\n`;
            }

            // PM perspective
            if (result.pm) {
              comment += `#### 📋 PM — ${emoji(result.pm.verdict)} ${result.pm.verdict}\n`;
              comment += `${result.pm.reasoning}\n\n`;
            }

            // Dev Lead perspective
            if (result.dev) {
              comment += `#### 🔧 Dev Lead — ${emoji(result.dev.verdict)} ${result.dev.verdict}\n`;
              comment += `${result.dev.reasoning}\n\n`;
              if (result.dev.tech_guide && result.dev.tech_guide.length > 0) {
                comment += `**Tech guide:**\n`;
                for (const step of result.dev.tech_guide) {
                  comment += `- ${step}\n`;
                }
                comment += `\n`;
              }
            }

            comment += `---\n*Maintainer: review above and apply \`approved\` to trigger the coding agent.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: comment
            });
            core.info('Posted triage comment');
